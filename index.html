<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veo 3.1 Video Generator</title>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Video Generator</h1>
        <p class="subtitle">Create AI-generated videos from text prompts</p>
        <span class="model-badge">veo-3.1-generate-preview</span>

        <div class="section">
            <label class="label">Prompt <span class="required">*</span></label>
            <textarea id="prompt-input" placeholder="Describe the video you want to create..." rows="3"></textarea>
        </div>

        <div class="section">
            <label class="label">Negative Prompt</label>
            <textarea id="negative-prompt" placeholder="What to avoid in the video..." rows="2"></textarea>
        </div>

        <div class="row">
            <div class="section flex-1">
                <label class="label">Duration</label>
                <select id="duration">
                    <option value="4">4 seconds</option>
                    <option value="6">6 seconds</option>
                    <option value="8" selected>8 seconds</option>
                </select>
            </div>
            <div class="section flex-1">
                <label class="label">Resolution</label>
                <select id="resolution">
                    <option value="1280x720">720p (1280x720)</option>
                    <option value="1920x1080">1080p (1920x1080)</option>
                    <option value="3840x2160">4K (3840x2160)</option>
                </select>
            </div>
        </div>

        <div class="section">
            <label class="label">First Frame (optional)</label>
            <div class="file-row">
                <input type="file" id="first-frame" accept="image/*" />
                <div class="file-preview" id="first-frame-preview"></div>
            </div>
        </div>

        <div class="section">
            <label class="label">Style Reference Images (up to 3, optional)</label>
            <div class="file-row">
                <input type="file" id="ref-images" accept="image/*" multiple />
                <div class="file-preview" id="ref-images-preview"></div>
            </div>
        </div>

        <div class="section">
            <label class="label">Last Frame (optional)</label>
            <div class="file-row">
                <input type="file" id="last-frame" accept="image/*" />
                <div class="file-preview" id="last-frame-preview"></div>
            </div>
        </div>

        <div class="section">
            <label class="checkbox-label">
                <input type="checkbox" id="test-mode" />
                Test mode (no credits used)
            </label>
        </div>

        <button id="generateBtn">Generate Video</button>

        <div id="status"></div>
        <div id="video-output"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
